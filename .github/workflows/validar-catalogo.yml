name: Validar Grimorio 3D

on:
  pull_request:
    paths:
      - 'README.md'
      - 'INDEX.md'
      - 'AGENTS.md'
      - 'FONTES/**'
      - 'GUIAS/**'
      - 'GOVERNANCA/**'
      - 'GLOSSARIO/**'
      - 'FAQ/**'
      - 'TUTORIAIS/**'
      - 'DEPENDENCIAS/**'
      - 'ACADEMIA/**'
      - 'CURRICULO/**'
      - 'NICHOS/**'
      - 'ECOSSISTEMA/**'
      - 'SKILLS/**'
      - 'ATUALIDADES/**'
      - 'scripts/**'
      - '.github/workflows/validar-catalogo.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar dados e categorias existentes
        run: python3 scripts/validar.py
      - name: Validar academia, curriculo anterior e links internos
        run: python3 scripts/validar-academia.py
      - name: Validar 293 termos do glossario, unicidade e material didatico
        run: python3 scripts/validar-glossario.py
      - name: Validar 210 perguntas de FAQ sem duplicacoes
        run: python3 scripts/validar-faq.py
      - name: Validar 37 laboratorios, etapas e rodapes SIN
        run: python3 scripts/validar-laboratorios.py
      - name: Validar ECP, Coliseu, nichos e regressao das 208 fontes
        run: python3 scripts/validar-ecp.py
      - name: Conferir integridade do índice autogerado no README
        run: python3 scripts/gerar-indice-readme.py --check
      - name: Conferir 100 por cento das URLs e rodapé SIN
        run: python3 scripts/validar-readme-index.py
